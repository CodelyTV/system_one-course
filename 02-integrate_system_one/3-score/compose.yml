services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - retail-postgres-data:/var/lib/postgresql

volumes:
  retail-postgres-data:
