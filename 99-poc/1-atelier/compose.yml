services:
  postgres:
    build: etc/postgres
    image: retail-postgres-jev
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - retail-postgres-data:/var/lib/postgresql/data

  laya:
    build: etc/laya
    image: retail-laya
    environment:
      LAYA_PORT: "8000"
      LAYA_DEVICE: cpu
      LAYA_PRELOAD: "1"
      LAYA_MODELS: english,multilingual
      LAYA_MAX_CONCURRENT: "4"
      LAYA_API_KEY: retail-laya
    ports:
      - "127.0.0.1:${LAYA_PORT:-58000}:8000"
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10m
    volumes:
      - retail-laya-models:/home/laya/.cache/huggingface

volumes:
  retail-postgres-data:
  retail-laya-models:
